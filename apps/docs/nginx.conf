server {
  listen 8080;
  server_name docs;
  root /usr/share/nginx/html;
  index index.html;

  large_client_header_buffers 4 32k;

  # Health probes have their own endpoint, and it is the *path* that opts out
  # of the access log. The previous version keyed the exemption on the client's
  # own User-Agent, so anyone who put "kube-probe" in theirs went unlogged for
  # as long as they liked — scanning and enumeration included.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  access_log /var/log/nginx/access.log main;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https: wss:; manifest-src 'self'; frame-ancestors 'none'; frame-src 'self';" always;

  location / {
    try_files $uri $uri/ @rewrites;
  }

  location @rewrites {
    rewrite "^(.+)$" /index.html last;
  }
}

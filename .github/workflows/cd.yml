name: CD

on:
  # push:
  #   branches:
  #   - develop
  #   - main
  workflow_dispatch:

env:
  MULTI_ARCH: true
  USE_QEMU: false
  TAG_MAJOR_AND_MINOR: false
  AUTOMERGE_PRERELEASE: true
  AUTOMERGE_RELEASE: true
  PRERELEASE_BRANCH: develop
  RELEASE_BRANCH: main

jobs:
  expose-vars:
    runs-on: ubuntu-latest
    outputs:
      BUN_VERSION: ${{ steps.bun-version.outputs.BUN_VERSION }}
      MULTI_ARCH: ${{ env.MULTI_ARCH }}
      USE_QEMU: ${{ env.USE_QEMU }}
      TAG_MAJOR_AND_MINOR: ${{ env.TAG_MAJOR_AND_MINOR }}
      AUTOMERGE_PRERELEASE: ${{ env.AUTOMERGE_PRERELEASE }}
      AUTOMERGE_RELEASE: ${{ env.AUTOMERGE_RELEASE }}
      PRERELEASE_BRANCH: ${{ env.PRERELEASE_BRANCH }}
      RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Read bun version from package.json
      id: bun-version
      run: echo "BUN_VERSION=$(jq -r '.packageManager | split("@")[1]' package.json)" >> "$GITHUB_OUTPUT"

  build-cli-binaries:
    uses: ./.github/workflows/release-cli.yml
    permissions:
      contents: read

  release:
    uses: this-is-tobi/github-workflows/.github/workflows/release-app.yml@v0
    needs:
    - expose-vars
    - build-cli-binaries
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      ENABLE_PRERELEASE: true
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' }}
      AUTOMERGE_PRERELEASE: ${{ needs.expose-vars.outputs.AUTOMERGE_PRERELEASE == 'true' }}
      AUTOMERGE_RELEASE: ${{ needs.expose-vars.outputs.AUTOMERGE_RELEASE == 'true' }}
      PRERELEASE_BRANCH: ${{ needs.expose-vars.outputs.PRERELEASE_BRANCH }}
      RELEASE_BRANCH: ${{ needs.expose-vars.outputs.RELEASE_BRANCH }}
      RELEASE_ARTIFACT_NAMES: cli-release-assets
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  # A matrix build cannot feed a matrix attest: `needs.<job>.outputs.<name>`
  # collapses to a single value across matrix combinations, so every image but
  # the last to finish would be attested wrong. One explicit build/attest pair
  # per image is the only correct shape, and it keeps `id-token`/`attestations`
  # on the attest jobs alone.
  build-api:
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@v0
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - expose-vars
    - release
    permissions:
      packages: write
      contents: read
    with:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/api
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_CONTEXT: ./
      IMAGE_DOCKERFILE: ./apps/api/Dockerfile
      BUILD_AMD64: true
      BUILD_ARM64: ${{ needs.expose-vars.outputs.MULTI_ARCH == 'true' }}
      USE_QEMU: ${{ needs.expose-vars.outputs.USE_QEMU == 'true' }}
      LATEST_TAG: ${{ github.ref == format('refs/heads/{0}', 'main') }}
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' }}
      CACHE: true
      BUILD_ARGS: "APP_VERSION=${{ needs.release.outputs.version }}"

  attest-api:
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@v0
    needs:
    - build-api
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      IMAGE_NAME: ${{ needs.build-api.outputs.image }}
      DIGEST: ${{ needs.build-api.outputs.digest }}
      PROVENANCE: true
      SBOM: true

  build-api-migrate:
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@v0
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - expose-vars
    - release
    permissions:
      packages: write
      contents: read
    with:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/api-migrate
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_CONTEXT: ./
      IMAGE_DOCKERFILE: ./apps/api/Dockerfile.migrate
      BUILD_AMD64: true
      BUILD_ARM64: ${{ needs.expose-vars.outputs.MULTI_ARCH == 'true' }}
      USE_QEMU: ${{ needs.expose-vars.outputs.USE_QEMU == 'true' }}
      LATEST_TAG: ${{ github.ref == format('refs/heads/{0}', 'main') }}
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' }}
      CACHE: true
      BUILD_ARGS: "APP_VERSION=${{ needs.release.outputs.version }}"

  attest-api-migrate:
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@v0
    needs:
    - build-api-migrate
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      IMAGE_NAME: ${{ needs.build-api-migrate.outputs.image }}
      DIGEST: ${{ needs.build-api-migrate.outputs.digest }}
      PROVENANCE: true
      SBOM: true

  build-docs:
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@v0
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - expose-vars
    - release
    permissions:
      packages: write
      contents: read
    with:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/docs
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_CONTEXT: ./
      IMAGE_DOCKERFILE: ./apps/docs/Dockerfile
      BUILD_AMD64: true
      BUILD_ARM64: ${{ needs.expose-vars.outputs.MULTI_ARCH == 'true' }}
      USE_QEMU: ${{ needs.expose-vars.outputs.USE_QEMU == 'true' }}
      LATEST_TAG: ${{ github.ref == format('refs/heads/{0}', 'main') }}
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' }}
      CACHE: true
      BUILD_ARGS: "APP_VERSION=${{ needs.release.outputs.version }}"

  attest-docs:
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@v0
    needs:
    - build-docs
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      IMAGE_NAME: ${{ needs.build-docs.outputs.image }}
      DIGEST: ${{ needs.build-docs.outputs.digest }}
      PROVENANCE: true
      SBOM: true

  build-cli:
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@v0
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - expose-vars
    - release
    permissions:
      packages: write
      contents: read
    with:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/cli
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_CONTEXT: ./
      IMAGE_DOCKERFILE: ./packages/cli/Dockerfile
      BUILD_AMD64: true
      BUILD_ARM64: ${{ needs.expose-vars.outputs.MULTI_ARCH == 'true' }}
      USE_QEMU: ${{ needs.expose-vars.outputs.USE_QEMU == 'true' }}
      LATEST_TAG: ${{ github.ref == format('refs/heads/{0}', 'main') }}
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' }}
      CACHE: true
      BUILD_ARGS: "APP_VERSION=${{ needs.release.outputs.version }}"

  attest-cli:
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@v0
    needs:
    - build-cli
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      IMAGE_NAME: ${{ needs.build-cli.outputs.image }}
      DIGEST: ${{ needs.build-cli.outputs.digest }}
      PROVENANCE: true
      SBOM: true

  build-mcp:
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@v0
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - expose-vars
    - release
    permissions:
      packages: write
      contents: read
    with:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/mcp
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_CONTEXT: ./
      IMAGE_DOCKERFILE: ./apps/mcp/Dockerfile
      BUILD_AMD64: true
      BUILD_ARM64: ${{ needs.expose-vars.outputs.MULTI_ARCH == 'true' }}
      USE_QEMU: ${{ needs.expose-vars.outputs.USE_QEMU == 'true' }}
      LATEST_TAG: ${{ github.ref == format('refs/heads/{0}', 'main') }}
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' }}
      CACHE: true
      BUILD_ARGS: "APP_VERSION=${{ needs.release.outputs.version }}"

  attest-mcp:
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@v0
    needs:
    - build-mcp
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      IMAGE_NAME: ${{ needs.build-mcp.outputs.image }}
      DIGEST: ${{ needs.build-mcp.outputs.digest }}
      PROVENANCE: true
      SBOM: true

  build-web:
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@v0
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - expose-vars
    - release
    permissions:
      packages: write
      contents: read
    with:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/web
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_CONTEXT: ./
      IMAGE_DOCKERFILE: ./apps/web/Dockerfile
      BUILD_AMD64: true
      BUILD_ARM64: ${{ needs.expose-vars.outputs.MULTI_ARCH == 'true' }}
      USE_QEMU: ${{ needs.expose-vars.outputs.USE_QEMU == 'true' }}
      LATEST_TAG: ${{ github.ref == format('refs/heads/{0}', 'main') }}
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' }}
      CACHE: true
      BUILD_ARGS: "APP_VERSION=${{ needs.release.outputs.version }}"

  attest-web:
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@v0
    needs:
    - build-web
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      IMAGE_NAME: ${{ needs.build-web.outputs.image }}
      DIGEST: ${{ needs.build-web.outputs.digest }}
      PROVENANCE: true
      SBOM: true

  release-npm:
    uses: this-is-tobi/github-workflows/.github/workflows/release-npm.yml@v0
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - expose-vars
    - release
    permissions:
      contents: read
      # release-npm.yml's own job declares id-token: write for npm trusted
      # publishing (OIDC). A reusable workflow can never hold more than its
      # caller grants, so without this the run fails at startup with
      # "requesting 'id-token: write', but is only allowed 'id-token: none'" -
      # even when publishing with NPM_TOKEN rather than OIDC.
      id-token: write
    with:
      RUNTIME: bun
      RUNTIME_VERSION: ${{ needs.expose-vars.outputs.BUN_VERSION }}
      PACKAGE_MANAGER: bun
      WORKING_DIRECTORY: packages/cli
      SCOPE: "@template-monorepo-ts"
      PRE_COMMAND: cd packages/shared && bun run build
      BUILD_COMMAND: bun run build:node
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-helm-chart:
    uses: this-is-tobi/github-workflows/.github/workflows/update-helm-chart.yml@v0
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - release
    permissions:
      pull-requests: write
      contents: write
      actions: write
    with:
      RUN_MODE: called
      CHART_DIR: .
      CHART_NAME: helm
      APP_VERSION: ${{ needs.release.outputs.version }}
      UPGRADE_TYPE: patch

  release-helm:
    uses: this-is-tobi/github-workflows/.github/workflows/release-helm.yml@v0
    if: ${{ needs.release.outputs.release-created == 'true' }}
    needs:
    - release
    - update-helm-chart
    permissions:
      contents: write
      packages: write
    with:
      CHARTS_DIR: .
      # Push the packaged chart to the OCI registry (ghcr.io by default), so it
      # can be pulled with `helm pull oci://ghcr.io/<owner>/<repo>/<chart>`.
      # release-helm.yml has two independent distribution channels and requires
      # at least one: this, or CREATE_GITHUB_RELEASE for a classic `helm repo
      # add` repository served from a gh-pages branch. Both default to false.
      PUBLISH_OCI: true
      HELM_REPOS: "this-is-tobi=https://this-is-tobi.github.io/helm-charts,prometheus-community=https://prometheus-community.github.io/helm-charts,grafana-community=https://grafana-community.github.io/helm-charts,open-telemetry=https://open-telemetry.github.io/opentelemetry-helm-charts"

  # Re-synchronise the prerelease branch onto the release branch once every job
  # that commits to the release branch has finished. `update-helm-chart` runs in
  # `called` mode, so it opens a pull request instead of committing here, and is
  # deliberately absent from `needs:` — listing it would let a failed chart bump
  # skip the sync.
  sync-prerelease-branch:
    uses: this-is-tobi/github-workflows/.github/workflows/sync-prerelease-branch.yml@v0
    if: ${{ github.ref_name == needs.expose-vars.outputs.RELEASE_BRANCH && needs.release.outputs.release-created == 'true' }}
    needs:
    - expose-vars
    - release
    permissions:
      contents: write
    with:
      RELEASE_BRANCH: ${{ needs.expose-vars.outputs.RELEASE_BRANCH }}
      PRERELEASE_BRANCH: ${{ needs.expose-vars.outputs.PRERELEASE_BRANCH }}
